server:
  port: 8888
  compression:
    enabled: true
    min-response-size: 2KB
spring:
  profiles:
    default: sqlite
  application:
    name: noone-server
    version: ${version}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  threads:
    virtual:
      enabled: true
jwt:
  secret: "u3SJYZOHd06qmX+AsSHKy9Mab8f3ciIWCQiqVvhsqlYZ9+HRmKp7akyzibfn1OdVMqCE2zjz1iHeWyj1Kg5zrg"
logging:
  level:
    org.apache.dubbo: WARN
noone:
  security:
    login-ip-whitelist: []
  plugin-registry:
