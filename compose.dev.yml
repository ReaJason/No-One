services:
  noone-server:
    image: reajason/noone-server:nightly
    environment:
      SPRING_DATASOURCE_URL: "jdbc:sqlite:/app/data/noone.db?busy_timeout=5000&journal_mode=WAL&foreign_keys=true"
    volumes:
      - sqlite-data:/app/data

  noone-web:
    image: reajason/noone-web:nightly
    depends_on:
      - noone-server
    environment:
      HOST: 0.0.0.0
      INTERNAL_API_BASE_URL: http://noone-server:8888/api
      PORT: 3000
      SESSION_SECRET: dev-session-secret-change-me
      SESSION_COOKIE_SECURE: false

  nginx:
    image: nginx:1.29-alpine
    depends_on:
      - noone-web
      - noone-server
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  sqlite-data:
