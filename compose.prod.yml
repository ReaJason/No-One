services:
  noone-server:
    image: ghcr.io/${GHCR_OWNER:-reajason}/noone-server:${NOONE_SERVER_TAG:-latest}
    environment:
      SPRING_DATASOURCE_URL: "jdbc:sqlite:/app/data/noone.db?busy_timeout=5000&journal_mode=WAL&foreign_keys=true"
    volumes:
      - sqlite-data:/app/data
    restart: unless-stopped

  noone-web:
    image: ghcr.io/${GHCR_OWNER:-reajason}/noone-web:${NOONE_WEB_TAG:-latest}
    depends_on:
      - noone-server
    environment:
      HOST: 0.0.0.0
      INTERNAL_API_BASE_URL: http://noone-server:8888/api
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET:-change-me}
      SESSION_COOKIE_SECURE: ${SESSION_SECRET:-false}
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    depends_on:
      - noone-web
      - noone-server
    ports:
      - "80:80"
    restart: unless-stopped
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  sqlite-data:
